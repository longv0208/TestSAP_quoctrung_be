services:
  db:
    image: postgres:16
    container_name: furpms-db-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Furpms@Strong123
      POSTGRES_DB: furpms
    # Cổng 5433 (không phải 5432 mặc định) — né trường hợp máy đã có Postgres cài sẵn
    # (ví dụ pgAdmin đang quản một bản cài native) chiếm đúng cổng mặc định.
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
